# DKMS kernel matrix — the distro's own linux-headers metapackage is always
# installable in a container and pins to that release's current kernel ABI.
# mainline-sweep + RT entries are the wider non-blocking coverage.

debian11:
- abi: 5.10.0-33-amd64
  blocking: true
  fetch: archive
  pkg: linux-headers-5.10.0-33-amd64
  ver: 5.10.226-1
- abi: 6.1.0-0.deb11.13-amd64
  blocking: true
  fetch: hwe
  pkg: linux-headers-6.1.0-0.deb11.13-amd64
  ver: '*'
debian12:
- abi: generic-amd64
  blocking: true
  fetch: archive
  pkg: linux-headers-amd64
  ver: '*'
debian13:
- abi: generic-amd64
  blocking: true
  fetch: archive
  pkg: linux-headers-amd64
  ver: '*'
- abi: generic-686-pae
  arch: i386
  blocking: true
  fetch: archive
  pkg: linux-headers-686-pae
  ver: '*'
mainline-sweep:
- abi: 6.12-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.12*
  ver: '*'
- abi: 6.13-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.13*
  ver: '*'
- abi: 6.14-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.14*
  ver: '*'
- abi: 6.15-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.15*
  ver: '*'
- abi: 6.16-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.16*
  ver: '*'
- abi: 6.17-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.17*
  ver: '*'
- abi: 6.18-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.18*
  ver: '*'
- abi: 6.19-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-6.19*
  ver: '*'
- abi: 7.0-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-7.0*
  ver: '*'
- abi: 7.1-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-7.1*
  ver: '*'
- abi: 7.2-mainline
  blocking: false
  fetch: mainline
  pkg: linux-headers-7.2*
  ver: '*'
ubuntu2004:
- abi: 5.4.0-200-generic
  blocking: true
  fetch: archive
  pkg: linux-headers-5.4.0-200-generic
  ver: '*'
- abi: 5.15.0-125-generic
  blocking: true
  fetch: hwe
  pkg: linux-headers-5.15.0-125-generic
  ver: '*'
ubuntu2204:
- abi: generic
  blocking: true

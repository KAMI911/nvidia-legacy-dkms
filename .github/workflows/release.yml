name: release

# On a version tag: run the full gate (static + smoke-build + reprotest), then,
# only if green, push the CI-rendered source packages to OBS (build on / publish
# off) via obs-push.yml. Publishing per repo stays a manual step.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:    { uses: ./.github/workflows/static.yml }
  smoke:     { uses: ./.github/workflows/smoke-build.yml }
  reprotest: { uses: ./.github/workflows/build-reprotest.yml }

  publish:
    needs: [static, smoke, reprotest]
    uses: ./.github/workflows/obs-push.yml
    secrets: inherit

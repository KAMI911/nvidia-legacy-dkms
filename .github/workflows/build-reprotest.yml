name: build-reprotest

# Build each (series, target) TWICE in a clean container with a varied
# environment, then diffoscope the .deb sets. SOURCE_DATE_EPOCH is pinned from
# debian/changelog and the .orig tarball has a fixed mtime, so the .debs must be
# byte-identical.

on:
  push:
    branches: [main]
    paths: ['common/**', 'packaging/**', '.github/workflows/build-reprotest.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  reprotest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: '390xx', target: 'debian13' }
          - { series: '340xx', target: 'debian13' }
          - { series: '580xx', target: 'debian13' }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - name: cache upstream .run
        uses: actions/cache@v4
        with:
          path: ~/.cache/nvidia-legacy
          key: run-${{ matrix.series }}
      - name: host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev xz-utils python3-yaml curl diffoscope
      - name: source package
        env: { NVL_XZ_LEVEL: '-4' }
        run: |
          S=${{ matrix.series }}; T=${{ matrix.target }}
          B="$RUNNER_TEMP/b"; mkdir -p "$B"
          common/scripts/verify-run.sh "$S"
          common/scripts/assemble-source.sh "$S" "$B"
          UV=$(python3 -c "import yaml;print(yaml.safe_load(open('common/drivers.yaml'))['series']['$S']['version'])")
          tar -C "$B" -xf "$B"/nvidia-legacy-${S}_${UV}.orig.tar.xz
          python3 common/scripts/render-debian.py --series "$S" --target "$T" --flavour dkms --out "$B/nvidia-legacy-${S}-${UV}"
          ( cd "$B" && dpkg-source --no-check -b "nvidia-legacy-${S}-${UV}" )
          echo "B=$B" >> "$GITHUB_ENV"
      - name: pull image once
        run: docker pull debian:trixie
      - name: build A
        run: docker run --rm -v "$B":/b -v "$PWD/tests/repro-build.sh":/rb.sh -e OUTDIR=A -e TZ=UTC        -e LC_ALL=C.UTF-8 debian:trixie sh /rb.sh
      - name: build B (varied env)
        run: docker run --rm -v "$B":/b -v "$PWD/tests/repro-build.sh":/rb.sh -e OUTDIR=B -e TZ=Asia/Tokyo -e LC_ALL=C.UTF-8 --hostname repro2 debian:trixie sh /rb.sh
      - name: diffoscope
        run: |
          rc=0
          for a in "$B"/A/*.deb; do
            b="$B/B/$(basename "$a")"
            if cmp -s "$a" "$b"; then
              echo "identical: $(basename "$a")"
            else
              echo "::error::not reproducible: $(basename "$a")"
              diffoscope --max-report-size 150000 "$a" "$b" || true
              rc=1
            fi
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reprotest-${{ matrix.series }}-${{ matrix.target }}
          path: ${{ env.B }}

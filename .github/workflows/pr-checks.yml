name: pr-checks

# Orchestrates build -> {dkms-matrix, autopkgtest} with proper `needs:`
# ordering. dkms-matrix.yml and autopkgtest.yml each download a
# debs-<series>-<target> artifact that only build.yml produces; triggering
# them independently on pull_request (as they used to) raced build.yml and
# always failed with "Artifact not found".
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  dkms:
    needs: build
    uses: ./.github/workflows/dkms-matrix.yml

  autopkgtest:
    needs: build
    uses: ./.github/workflows/autopkgtest.yml

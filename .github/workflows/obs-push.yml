name: obs-push

# Render the CI-pinned source packages and push them to OBS (build on / publish
# off). Standalone (workflow_dispatch) for fast iteration, and reused by
# release.yml after the gates are green.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      series:
        description: 'space-separated series, or "all" for every blocking series'
        default: 'all'
      project_config:
        description: 'also apply _obs project meta + prjconf first'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    environment: obs
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }

      - name: osc
        env:
          OSC_USER: ${{ secrets.OSC_USER }}
          OSC_PASS: ${{ secrets.OSC_PASS }}
        run: |
          test -n "$OSC_USER" && test -n "$OSC_PASS" || {
            echo "::error::OSC_USER / OSC_PASS secrets not set — see _obs/README.md"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq osc python3-yaml dpkg-dev xz-utils curl
          mkdir -p ~/.config/osc
          APIURL="${{ vars.OSC_APIURL || 'https://api.opensuse.org' }}"
          cat > ~/.config/osc/oscrc <<EOF
          [general]
          apiurl = $APIURL
          [$APIURL]
          user = $OSC_USER
          pass = $OSC_PASS
          credentials_mgr_class = osc.credentials.PlaintextConfigFileCredentialsManager
          EOF
          chmod 600 ~/.config/osc/oscrc
          osc -A "$APIURL" whois

      - name: apply project meta + prjconf
        # workflow_call (release.yml) has no inputs -> default true
        if: ${{ github.event.inputs.project_config != 'false' }}
        env:
          OBS_PROJECT: ${{ vars.OSC_PROJECT || 'home:KAMI911:nvidia-legacy:dkms' }}
        run: |
          _obs/render.sh prj > /tmp/prj-meta.xml
          echo "--- project meta ($OBS_PROJECT) ---"; cat /tmp/prj-meta.xml
          osc meta prj     "$OBS_PROJECT" -F /tmp/prj-meta.xml
          osc meta prjconf "$OBS_PROJECT" -F _obs/prjconf
          echo "project config applied"

      - name: pick series
        id: pick
        run: |
          want='${{ github.event.inputs.series || 'all' }}'
          if [ "$want" = all ] || [ -z "$want" ]; then
            want=$(python3 -c "import yaml;print(' '.join(k for k,v in yaml.safe_load(open('series.yaml'))['build'].items() if v.get('blocking') is not False))")
          fi
          echo "series=$want" >> "$GITHUB_OUTPUT"
          echo "building: $want"

      - name: render + assemble
        env: { NVL_XZ_LEVEL: '-9e' }
        run: |
          B="$RUNNER_TEMP/src"; mkdir -p "$B"; echo "BUILDDIR=$B" >> "$GITHUB_ENV"
          for s in ${{ steps.pick.outputs.series }}; do
            common/scripts/verify-run.sh "$s"
            common/scripts/assemble-source.sh "$s" "$B"
            uv=$(python3 -c "import yaml;print(yaml.safe_load(open('common/drivers.yaml'))['series']['$s']['version'])")
            for t in $(python3 -c "import yaml;print(' '.join(yaml.safe_load(open('series.yaml'))['build']['$s']['targets']))"); do
              sd="$B/nvidia-legacy-$s-$uv"; rm -rf "$sd"
              tar -C "$B" -xf "$B/nvidia-legacy-${s}_${uv}.orig.tar.xz"
              python3 common/scripts/render-debian.py --series "$s" --target "$t" --flavour dkms --out "$sd"
              ( cd "$B" && dpkg-source --no-check -b "nvidia-legacy-$s-$uv" )
            done
          done

      - name: sync to OBS
        env:
          OBS_PROJECT: ${{ vars.OSC_PROJECT || 'home:KAMI911:nvidia-legacy:dkms' }}
        run: |
          for s in ${{ steps.pick.outputs.series }}; do
            BUILDDIR="$BUILDDIR" tools/obs-sync.sh "$s"
          done

      - run: echo "OBS builds now; packages stay publish=disable until 'obs-set-publish.py <series> <target> enable' after 'osc results' is green."

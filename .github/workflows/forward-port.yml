name: forward-port

# Heavy compile sweeps that don't belong on a laptop:
#  feasibility-recheck compiles every experimental/best-effort legacy module
#  against a kernel sweep (NO GPU) and reports the first failing kernel.
#  Runs on GitHub-hosted runners; commits docs/forward-port-status/*.md via PR.

on:
  workflow_dispatch:
    inputs:
      series:
        description: "series (blank = all experimental/best-effort)"
        required: false
      from:
        description: "kernel from (X.Y)"
        required: false
        default: "5.4"
      to:
        description: "kernel to (X.Y)"
        required: false
        default: "7.3"
      patched:
        description: "apply the gated patch series first"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 6"

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.s.outputs.list }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: pip install pyyaml
      - id: s
        run: python3 .github/scripts/fwd-series.py "${{ inputs.series }}" >> "$GITHUB_OUTPUT"

  sweep:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJson(needs.matrix.outputs.series) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman python3-yaml curl xz-utils
      - name: cache upstream .run
        uses: actions/cache@v4
        with:
          path: ~/.cache/nvidia-legacy
          key: run-${{ matrix.series }}
      - name: verify blobs
        run: common/scripts/verify-run.sh ${{ matrix.series }}
      - name: feasibility-recheck
        run: |
          FLAGS="--from ${{ inputs.from || '5.4' }} --to ${{ inputs.to || '7.3' }}"
          if [ "${{ inputs.patched }}" != "false" ]; then FLAGS="$FLAGS --patched"; fi
          common/scripts/feasibility-recheck.sh ${{ matrix.series }} $FLAGS
      - uses: actions/upload-artifact@v4
        with:
          name: forward-port-status-${{ matrix.series }}
          path: common/docs/forward-port-status/${{ matrix.series }}.md

  pr:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/fps
          merge-multiple: true
      - run: |
          mkdir -p common/docs/forward-port-status
          cp /tmp/fps/*.md common/docs/forward-port-status/ 2>/dev/null || true
      - uses: peter-evans/create-pull-request@v6
        with:
          path: common
          branch: bot/forward-port-status
          title: "docs: forward-port compile-sweep status"
          commit-message: "docs: forward-port compile-sweep status (automated)"
          body: "Automated feasibility-recheck.sh sweep."
          labels: automated, forward-port
